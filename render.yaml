services:
  - type: web
    name: pitpom-minigolfe
    runtime: docker
    repo: https://github.com/vitor-martinsb/MG-pitpom
    branch: staging
    plan: free
    region: virginia
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
