services:
  - type: web
    name: pitpom-minigolfe
    runtime: docker
    repo: https://github.com/vitor-martinsb/MG-pitpom
    branch: staging
    plan: free
    region: virginia
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    envVars:
      - key: GOLF_CPU_BUDGET
        value: "0.1"
      - key: GOLF_BOT_CPU_FRACTION
        value: "0.04"
      - key: GOLF_BOT_SEARCH_MS
        value: "20"
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
